<text x="44" y="772" font-size="14.5" fill="#000084" text-anchor="start" font-weight="normal" font-style="normal">3. The touchscreen is both an input (touch) and an output (display).</text>
<text x="44" y="796" font-size="14.5" fill="#000084" text-anchor="start" font-weight="normal" font-style="normal">4. The phone and the device must be on the same Wi-Fi network or hotspot.</text>
